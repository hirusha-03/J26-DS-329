name: CI

on:
  push:
    branches: [main, develop, Develop, 'feat/**']
  pull_request:
    branches: [main, develop, Develop, 'feat/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      # Blocking: syntax errors and undefined names
      - name: Ruff (critical)
        run: ruff check backend --select E9,F63,F7,F82 --output-format github
      # Report only until the existing backlog is cleaned up
      - name: Ruff (full, report only)
        continue-on-error: true
        run: ruff check backend --output-format github --statistics

  backend-build:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Compile
        run: python -m compileall -q backend/app
      - uses: docker/setup-buildx-action@v3
      - name: Docker build (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: Frontend ${{ matrix.app }} (lint + build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: monitor
            strict_lint: false  # 114 existing errors; set true once cleaned up
          - app: dashboard
            strict_lint: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # package-lock.json was generated on Windows and only lists win32 native binaries
      - name: Add Linux native binaries
        run: |
          v() { node -p "require('./package-lock.json').packages['node_modules/$1'].version"; }
          npm install --no-save --no-package-lock             lightningcss-linux-x64-gnu@$(v lightningcss)             @tailwindcss/oxide-linux-x64-gnu@$(v @tailwindcss/oxide)
      - name: Lint
        continue-on-error: ${{ !matrix.strict_lint }}
        run: npm run lint -w frontend/${{ matrix.app }}
      - name: Build
        run: npm run build -w frontend/${{ matrix.app }}
        env:
          NEXT_TELEMETRY_DISABLED: 1
